import = [
    "~/.config/alacritty/themes/themes/solarized_dark.toml"
]

[env]
TERM = "xterm-256color"

[font]
size = 10.0

## 0xProto is at (https://github.com/0xType/0xProto)

[font.bold]
family = "0xProto Nerd Font"
style = "Bold"

[font.bold_italic]
family = "0xProto Nerd Font"
style = "Bold Italic"

[font.italic]
family = "0xProto Nerd Font"
style = "Italic"

[font.normal]
family = "0xProto Nerd Font"
style = "Regular"

[shell]
args = ["--"]
program = "/usr/bin/zsh"

[window]
padding.x = 5
padding.y = 5

decorations = "Buttonless"
opacity = 0.99
blur = true


# [[keyboard.bindings]]
# key = "Return"
# mods = "Shift"
#chars = "\x1b\r"
